# GitHub only reads this file from the default branch (main) — this copy
# is not read by Dependabot. See main's .github/dependabot.yml for the
# actual config, which targets this branch via target-branch.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
