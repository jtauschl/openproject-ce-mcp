# GitHub only reads this file from the default branch (main) -- a copy on
# any other branch is never read by Dependabot. main itself is a frozen
# release snapshot (see README.md/CONTRIBUTING.md), never a PR target, so
# every block below has an explicit target-branch pointing at an actual
# active release branch -- an unscoped block would open unmergeable PRs
# against main. Only the next-release branch gets blocks: a bugfix line
# that is forward-merged into it takes dependency updates only as
# deliberate backports, so it doesn't collect duplicate bump PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/0.5.0
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: uv
    directory: /
    target-branch: release/0.5.0
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      python-dependencies:
        patterns:
          - "*"

  # The locked tools of ./dev and the workflows (bandit, semgrep, twine, pip-licenses) live in their own uv project.
  # The semgrep-rules commit is not a package: tools/update_semgrep_manifest.py bumps it by hand.
  - package-ecosystem: uv
    directory: /tools/lint
    target-branch: release/0.5.0
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      lint-tools:
        patterns:
          - "*"

  # The build backend of the distribution (hatchling) lives in its own uv project; ./dev dist exports its lock as the
  # hashed build constraints of `uv build`.
  - package-ecosystem: uv
    directory: /tools/build
    target-branch: release/0.5.0
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      build-tools:
        patterns:
          - "*"
