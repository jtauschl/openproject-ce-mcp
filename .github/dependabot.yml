# GitHub only ever reads this file from the default branch (main), but
# target-branch controls where each block's PRs actually open. main itself
# is not actively developed, so there is no block targeting main directly —
# only the two currently-maintained release lines below.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/0.3.8
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    target-branch: release/0.3.8
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: release/0.4.0
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    target-branch: release/0.4.0
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
