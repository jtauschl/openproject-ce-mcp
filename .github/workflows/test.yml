name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
  # GitHub only fires `schedule` from a workflow file that exists on the
  # repo's default branch (main), regardless of which branch it's checked
  # out on here (see secret-scan.yml, which hits the same constraint) —
  # until this file is promoted to main, this trigger is inert. A manual
  # `workflow_dispatch` run against this branch already works today, since
  # that lets you pick the ref to run against.
  schedule:
    - cron: "17 5 * * 1" # weekly, Monday ~05:17 UTC (off the hour, less likely to be delayed/dropped)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy

      - name: Run bandit (SAST)
        run: uvx bandit -r src/openproject_ce_mcp -ll

      - name: Run semgrep (SAST)
        run: uvx semgrep --config auto --error src/openproject_ce_mcp

      - name: Check dependency licenses
        run: uvx pip-licenses --python .venv/bin/python3 --fail-on="GPL;LGPL;AGPL"

  # macos-latest/windows-latest cost roughly 10x/2x a Linux runner-minute — scoped to
  # release-time confirmation only (the workflow_call from publish.yml's tag push, or a
  # manual workflow_dispatch), never the per-push/per-PR gate. Split into two jobs rather
  # than one matrix job with a job-level `if`, because GitHub Actions job-level `if` can't
  # reference `matrix` at all, and a step-level `if` still provisions (and bills) the
  # runner before skipping — so test-macos-windows below uses a job-level `if` on
  # a job with a fixed (non-matrix) runs-on per OS instead.
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: uv run pytest

      - name: Run tests with coverage gate
        if: matrix.python-version == '3.12'
        run: uv run pytest --cov=src/openproject_ce_mcp --cov-report=term-missing

  test-macos-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest

  # A real end-user install (pipx/uv tool install/pip/uvx) resolves the
  # newest version satisfying pyproject.toml's declared ranges at install
  # time -- uv.lock only pins one specific version, so the normal test-linux
  # job above never exercises anything newer than that pin. This job runs
  # `uv sync --upgrade`, which re-resolves every dependency to its newest
  # allowed version and updates the lockfile's pins accordingly (in-memory
  # for this job only, not committed back to the repo), so drift inside the
  # declared ranges (mcp>=2,<3 above all) gets caught here instead of by a
  # real user (OPM-254).
  test-newest-deps:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Install dependencies at their newest allowed versions
        run: uv sync --dev --upgrade

      - name: Run tests
        run: uv run pytest

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Generate SBOM
        run: |
          uv export --no-dev --format requirements-txt --no-hashes -o requirements.txt
          uvx --from cyclonedx-bom cyclonedx-py requirements requirements.txt --of JSON -o sbom.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json

  launchers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Check get.sh syntax (POSIX sh)
        run: sh -n get.sh

      - name: Check shell scripts syntax (bash -n)
        run: |
          for f in dev uninstall.sh docker/test/up.sh docker/test/down.sh tools/api-check/fetch-sources.sh; do
            bash -n "$f"
          done

      - name: shellcheck
        run: shellcheck get.sh uninstall.sh dev docker/test/up.sh docker/test/down.sh tools/api-check/fetch-sources.sh

      - name: Install shfmt
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: shfmt
        run: shfmt -l get.sh uninstall.sh dev docker/test/up.sh docker/test/down.sh tools/api-check/fetch-sources.sh

      - name: Check get.ps1 / uninstall.ps1 syntax (PowerShell parser)
        shell: pwsh
        run: |
          $hadErrors = $false
          foreach ($f in @("get.ps1", "uninstall.ps1")) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "::error file=$f::$($_.Message)" }
              $hadErrors = $true
            }
          }
          if ($hadErrors) { exit 1 }

      - name: Run launcher tests
        run: uv run pytest -m launcher
