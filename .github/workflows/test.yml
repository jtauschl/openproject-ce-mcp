# Deviations from local-first CI:
# - lint, test-linux, build and shell-scripts re-run every ./dev ci check
#   except actionlint, which stays local-only, on pushes to main and the
#   release branches and on every PR: Actions minutes are free on this
#   public repo, and main's ruleset requires the lint, build and Python 3.12
#   test-linux results before a merge. macOS and Windows stay release-time
#   only.
# - The integration tests (tests/integration) need live OpenProject
#   instances, one per supported version (docker/test), and run at release
#   time, not before every push. Any API or payload behavior the unit tests'
#   mocks do not model surfaces only at the next release review.
name: Tests

on:
  push:
    branches: [main, release/0.4.5, release/0.5.0]
  pull_request:
  workflow_call:
  workflow_dispatch:
  # GitHub only fires `schedule` from a workflow file that exists on the
  # repo's default branch (main) — this file is on main, so this trigger
  # is live. A manual `workflow_dispatch` run against any branch also
  # works, since that lets you pick the ref to run against.
  schedule:
    - cron: "17 5 * * 1" # weekly, Monday ~05:17 UTC (off the hour, less likely to be delayed/dropped)

permissions:
  contents: read

concurrency:
  # Prefixed, not the `${{ github.workflow }}-${{ github.ref }}` default --
  # inside a reusable-workflow call, `github.workflow` resolves to the
  # *caller's* name, so the default group would collide with a caller like
  # publish.yml's own group and self-cancel this run before any job starts.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy

      - name: Run bandit (SAST)
        run: uvx bandit -r src/openproject_ce_mcp -ll

      - name: Run semgrep (SAST)
        run: uvx semgrep --config auto --error src/openproject_ce_mcp

      - name: Check dependency licenses
        run: ./dev licenses

  # macos-latest/windows-latest cost roughly 10x/2x a Linux runner-minute — scoped to
  # release-time confirmation only (the workflow_call from publish.yml's tag push, or a
  # manual workflow_dispatch), never the per-push/per-PR gate. Split into two jobs rather
  # than one matrix job with a job-level `if`, because GitHub Actions job-level `if` can't
  # reference `matrix` at all, and a step-level `if` still provisions (and bills) the
  # runner before skipping — so test-macos-windows below uses a job-level `if` on
  # a job with a fixed (non-matrix) runs-on per OS instead.
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: uv run pytest

      - name: Run tests with coverage gate
        if: matrix.python-version == '3.12'
        run: ./dev test

  test-macos-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest

  # A real end-user install (pipx/uv tool install/pip/uvx) resolves the
  # newest version satisfying pyproject.toml's declared ranges at install
  # time -- uv.lock only pins one specific version, so the normal test-linux
  # job above never exercises anything newer than that pin. This job runs
  # `uv sync --upgrade`, which re-resolves every dependency to its newest
  # allowed version and updates the lockfile's pins accordingly (in-memory
  # for this job only, not committed back to the repo), so drift inside the
  # declared ranges (mcp>=2,<3 above all) gets caught here instead of by a
  # real user.
  test-newest-deps:
    # Also on push: a new SDK release can change behaviour between the weekly
    # runs, and only release-branch pushes exercise the code about to ship.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies at their newest allowed versions
        run: uv sync --dev --upgrade

      - name: Run tests
        run: uv run pytest

  # The other end of the declared ranges: uv.lock follows the newest releases,
  # so without this job nothing would show that a range's lower bound
  # (mcp>=2 above all) still works.
  test-lowest-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # uv pip into a venv outside the project, never uv sync or uv run: those
    # re-lock, writing the lowest versions into uv.lock.
    env:
      UV_RESOLUTION: lowest-direct
      # Not measure: the tests stub out tiktoken, so its floor would be installed but never exercised.
      EXTRA: dev
      GROUP: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # uv pip's --group support and lowest-direct semantics vary between uv releases.
          version: "0.12.24"
          python-version: "3.10"

      - name: Install direct dependencies at their lowest allowed versions
        run: |
          uv venv "$RUNNER_TEMP/lowest-deps"
          uv pip install --python "$RUNNER_TEMP/lowest-deps" --editable ".[$EXTRA]" --group "$GROUP"

      - name: Check every direct dependency sits on its declared lower bound
        run: '"$RUNNER_TEMP/lowest-deps/bin/python" tools/check_dependency_floors.py --extra "$EXTRA" --group "$GROUP"'

      - name: Run tests
        run: '"$RUNNER_TEMP/lowest-deps/bin/python" -m pytest'

      - name: Check uv.lock is untouched
        run: git diff --exit-code -- uv.lock

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # uv's CycloneDX export is experimental, so the job runs the uv release it was written against.
          version: "0.12.24"
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Generate and check the SBOM
        run: ./dev sbom

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json

  shell-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install shfmt
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # ./dev holds the script list and the required shfmt version.
      - name: shellcheck, shfmt and bash -n
        run: ./dev shell-lint
