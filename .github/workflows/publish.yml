name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

concurrency:
  # A distinct, prefixed group name -- not the shared `${{ github.workflow
  # }}-${{ github.ref }}` default -- because the called test.yml's own
  # concurrency group resolves `github.workflow` to *this* (caller)
  # workflow's name inside a reusable-workflow call, colliding with this
  # group and self-cancelling the test job before it starts (GitHub docs:
  # reusing-workflow-configurations#supported-keywords-for-jobs-that-call-a-reusable-workflow).
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: write       # actions/checkout, plus gh release create/upload (GITHUB_TOKEN)
      id-token: write       # required for PyPI trusted publishing (OIDC) and attestation signing
      attestations: write   # required to publish a build-provenance attestation

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag is an exact plain SemVer (no pre-release suffix)
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not an exact plain vMAJOR.MINOR.PATCH tag — refusing to publish" >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag v$tag_version does not match pyproject.toml version $pkg_version" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      # Validated BEFORE the PyPI publish step, deliberately -- uv publish
      # makes this release immutably public and a failed re-run afterward
      # can never recover (PyPI rejects re-uploading the same version's
      # files), so any gate that can still be fixed by editing CHANGELOG.md
      # and re-tagging must run first, while that's still an option.
      - name: Extract this version's CHANGELOG section for release notes
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            /^## \[/ { if (found) exit; if ($0 ~ "^## \\[" ver "\\]") { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version ${GITHUB_REF_NAME#v} — add one before tagging" >&2
            exit 1
          fi

      - name: Publish to PyPI
        # --check-url makes this step idempotent: if a prior run of this job
        # already uploaded this version's files (e.g. a later step like `gh
        # release create` below failed transiently and the whole job got
        # re-run), uv skips re-uploading files already present on the index
        # instead of failing outright -- PyPI rejects re-uploading a
        # version's files unconditionally, so without this a transient
        # post-publish failure would permanently strand the job: every
        # re-run fails here before ever reaching the steps that actually
        # need to be retried.
        run: uv publish --check-url https://pypi.org/simple/

      - name: Generate SHA-256 checksums
        # Generated after attestation, so the attested dist/* subject set
        # (wheel + sdist only) never includes this derived file.
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cd ..

      - name: Create GitHub Release with wheel, sdist, and checksums
        # Idempotent re-run: `gh release create <tag> <files>...` makes
        # several separate API calls under the hood (create the release as
        # a draft, upload each asset, then publish) -- if an asset upload
        # fails partway through, an incomplete release is left behind, and
        # a re-run's plain `gh release create` fails outright with "release
        # already exists" before it can ever finish uploading the missing
        # assets, even though the now-idempotent `uv publish` step above
        # would otherwise let the whole job be safely retried. Split into
        # "create the release if it doesn't already exist" (no assets yet)
        # followed by "upload/replace all three assets" (`--clobber`,
        # unconditionally, so this is correct whether the release is
        # brand new or a retry of an incomplete one) instead of one
        # combined call.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS

  # Split into two jobs, deliberately -- NOT for readability, but because
  # `brew update-python-resources` (below) executes the `setup.py` of every
  # transitive dependency in this package's closure to compute its resource
  # blocks. A compromised transitive dependency's setup.py runs with this
  # job's full filesystem access and can persist a change anywhere under
  # $GITHUB_WORKSPACE, e.g. planting a `.git/hooks/pre-push` in the tap
  # checkout -- `permissions: {}`/`persist-credentials: false` alone don't
  # stop this, since they only delay *when* a credential becomes available
  # in the SAME runner, not prevent a later step in that same runner from
  # ever holding one. The only structural fix is to never let the step that
  # holds TAP_REPO_PAT share a runner/workspace with the step that executes
  # untrusted code: prepare-homebrew-formula holds no secret at all and
  # produces a plain data artifact (the rendered Formula file's text); the
  # separate push-homebrew-formula job holds TAP_REPO_PAT and does a fresh
  # checkout of its own, but never runs `brew update-python-resources` or
  # any other step that executes third-party code -- it only overwrites the
  # Formula file with the artifact's already-computed text and pushes.
  prepare-homebrew-formula:
    needs: publish
    runs-on: ubuntu-latest # Linuxbrew is preinstalled here too; nothing this job does is macOS-specific
    timeout-minutes: 15
    permissions: {} # no GITHUB_TOKEN scope needed; reads the tap repo publicly, no push from here
    outputs:
      formula_changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout tap repo (public read, no credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: jtauschl/homebrew-tap
          persist-credentials: false

      - name: Add Linuxbrew to PATH
        # Preinstalled on the ubuntu-latest image but deliberately not on PATH
        # by default (actions/runner-images' own Ubuntu readme).
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Resolve released version, sdist URL, and checksum
        # The version-specific PyPI endpoint, not the generic /json "latest"
        # one -- a just-tagged release may not be reflected there instantly,
        # and this also gives the real sdist URL directly (its path segments
        # are a content hash, not a predictable pattern from the filename).
        # Written to a file and read back by Python directly, not piped
        # through a shell variable via `echo`, which corrupts JSON containing
        # control characters.
        run: |
          version="${GITHUB_REF_NAME#v}"
          curl -sf "https://pypi.org/pypi/openproject-ce-mcp/${version}/json" -o pypi-info.json
          url="$(python3 -c 'import json; d = json.load(open("pypi-info.json")); print(next(f["url"] for f in d["urls"] if f["packagetype"] == "sdist"))')"
          sha256="$(python3 -c 'import json; d = json.load(open("pypi-info.json")); print(next(f["digests"]["sha256"] for f in d["urls"] if f["packagetype"] == "sdist"))')"
          rm pypi-info.json
          {
            echo "VERSION=$version"
            echo "SDIST_URL=$url"
            echo "SHA256=$sha256"
          } >> "$GITHUB_ENV"

      - name: Update url, sha256, and version in the Formula
        # GNU sed (this job now runs on ubuntu-latest, not macOS) takes -i
        # with no argument for "no backup file" -- BSD sed's -i requires an
        # (empty-string) argument for the same thing, so the two are not
        # interchangeable.
        run: |
          sed -i "s|^  url \".*\"|  url \"${SDIST_URL}\"|" Formula/openproject-ce-mcp.rb
          sed -i "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" Formula/openproject-ce-mcp.rb

      - name: Regenerate pinned resource blocks
        # Untrusted: executes every transitive dependency's setup.py -- this
        # job holds no secret at all, see the job-level comment above.
        run: |
          brew update-python-resources \
            --version="$VERSION" \
            --package-name=openproject-ce-mcp \
            --exclude-packages=pywin32 \
            Formula/openproject-ce-mcp.rb

      - name: Record whether the Formula actually changed
        id: diff
        run: |
          if git diff --quiet Formula/openproject-ce-mcp.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the rendered Formula as a plain data artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula
          path: Formula/openproject-ce-mcp.rb
          retention-days: 1
          # An artifact name is immutable within one workflow run -- a
          # "Re-run all jobs" after the downstream push-homebrew-formula job
          # failed would otherwise re-run this job too and fail this upload
          # outright with "already exists", same reasoning as test.yml's
          # dist/sbom uploads.
          overwrite: true

  push-homebrew-formula:
    needs: [publish, prepare-homebrew-formula]
    if: needs.prepare-homebrew-formula.outputs.formula_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {} # only ever authenticates via secrets.TAP_REPO_PAT below, never GITHUB_TOKEN
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: jtauschl/homebrew-tap
          token: ${{ secrets.TAP_REPO_PAT }}
          persist-credentials: false # this job's own step passes TAP_REPO_PAT
          # explicitly via `gh auth setup-git` below instead -- this job never
          # runs untrusted code, but keeping the same discipline as the
          # prepare job means a credential is never left sitting in
          # .git/config for longer than the one step that actually needs it.

      - name: Download the already-computed Formula (no code execution here)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: homebrew-formula
          path: Formula

      - name: Push a commit and open a PR against the tap
        env:
          GH_TOKEN: ${{ secrets.TAP_REPO_PAT }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          branch="bump-${version}"
          gh auth setup-git

          # Idempotent re-run: if a prior run of this job already pushed
          # this branch but then failed transiently before (or during)
          # `gh pr create` below, a plain `git checkout -b`/`git push`
          # here would either fail outright (branch already exists
          # locally -- moot, this is always a fresh checkout) or push a
          # NEW commit that the existing remote branch can't fast-forward
          # to, since it isn't a descendant of whatever commit the prior
          # run already pushed. If the remote branch already exists,
          # reuse it as-is (it already has the correct Formula content
          # from that prior run) instead of creating another commit on it.
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
            echo "Branch $branch already exists on the tap -- reusing it (a prior run already pushed it)."
          else
            git checkout -b "$branch"
            git -c user.name="openproject-ce-mcp release bot" -c user.email="noreply@github.com" \
              commit -am "openproject-ce-mcp ${version}"
            git push origin "$branch"
          fi

          # gh pr create exits non-zero with an "already exists" message if
          # a prior run of this job already opened this exact PR (branch
          # already pushed, PR creation is the step that failed
          # transiently) -- that specific case is a successful re-run, not
          # a job failure, so it's matched and swallowed explicitly; any
          # OTHER gh pr create failure still fails the job normally.
          # --head is required here: the "branch already exists" case above
          # deliberately never checks the existing remote branch out
          # locally (it needs no new commit), so the local working tree
          # stays on the tap's default branch -- gh pr create without
          # --head would infer that default branch as the PR's head
          # instead of the actual bump branch, and either fail or (worse)
          # open a PR with the wrong, empty diff.
          if ! output="$(gh pr create --title "openproject-ce-mcp ${version}" \
            --head "$branch" \
            --body "Automated bump after the openproject-ce-mcp ${version} PyPI release." 2>&1)"; then
            if echo "$output" | grep -qi "already exists"; then
              echo "PR for $branch already exists (a prior run already opened it) -- treating as success."
              echo "$output"
            else
              echo "$output" >&2
              exit 1
            fi
          else
            echo "$output"
          fi
