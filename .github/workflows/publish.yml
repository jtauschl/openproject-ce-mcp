name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

concurrency:
  # A distinct, prefixed group name -- not the shared `${{ github.workflow
  # }}-${{ github.ref }}` default -- because the called test.yml's own
  # concurrency group resolves `github.workflow` to *this* (caller)
  # workflow's name inside a reusable-workflow call, colliding with this
  # group and self-cancelling the test job before it starts (GitHub docs:
  # reusing-workflow-configurations#supported-keywords-for-jobs-that-call-a-reusable-workflow).
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A job that calls a reusable workflow has no steps of its own, so a malformed
  # tag is stopped here, before the called workflow starts.
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}

    steps:
      - name: Verify tag is an exact plain SemVer (no pre-release suffix)
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not an exact plain vMAJOR.MINOR.PATCH tag — refusing to publish" >&2
            exit 1
          fi

  test:
    needs: verify-tag
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # Kept out of the publish job so the downloaded mcp-publisher has no access
  # to that job's PyPI OIDC token or write-scoped GITHUB_TOKEN.
  validate-server-json:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate server.json against the MCP Registry
        run: |
          tools/install-mcp-publisher.sh "$RUNNER_TEMP"
          "$RUNNER_TEMP/mcp-publisher" validate server.json

  publish:
    needs: [test, validate-server-json]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: write       # actions/checkout, plus gh release create/upload/edit (GITHUB_TOKEN)
      id-token: write       # required for PyPI trusted publishing (OIDC) and attestation signing
      attestations: write   # required to publish a build-provenance attestation

    steps:
      - name: Verify tag is an exact plain SemVer (no pre-release suffix)
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not an exact plain vMAJOR.MINOR.PATCH tag — refusing to publish" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag v$tag_version does not match pyproject.toml version $pkg_version" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      # Validated BEFORE the PyPI publish step, deliberately -- uv publish
      # makes this release immutably public and a failed re-run afterward
      # can never recover (PyPI rejects re-uploading the same version's
      # files), so any gate that can still be fixed by editing CHANGELOG.md
      # and re-tagging must run first, while that's still an option.
      - name: Extract this version's CHANGELOG section for release notes
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            /^## \[/ { if (found) exit; if ($0 ~ "^## \\[" ver "\\]") { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version ${GITHUB_REF_NAME#v} — add one before tagging" >&2
            exit 1
          fi

      - name: Publish to PyPI
        # --check-url makes this step idempotent: if a prior run of this job
        # already uploaded this version's files (e.g. a later step like `gh
        # release create` below failed transiently and the whole job got
        # re-run), uv skips re-uploading files already present on the index
        # instead of failing outright -- PyPI rejects re-uploading a
        # version's files unconditionally, so without this a transient
        # post-publish failure would permanently strand the job: every
        # re-run fails here before ever reaching the steps that actually
        # need to be retried.
        run: uv publish --check-url https://pypi.org/simple/

      - name: Generate SHA-256 checksums
        # Generated after attestation, so the attested dist/* subject set
        # (wheel + sdist only) never includes this derived file.
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cd ..

      - name: Create GitHub Release with wheel, sdist, and checksums
        # Every asset goes onto a draft and the draft is published last, so
        # the flow also holds with Immutable Releases on, where a published
        # release's assets are locked. A re-run completes an existing draft;
        # a published release is never changed, only checked.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          assets=(dist/*.whl dist/*.tar.gz dist/SHA256SUMS)
          expected_names="$(for asset in "${assets[@]}"; do basename "$asset"; done | jq -R . | jq -sc .)"

          # Listed through the REST API rather than looked up by tag: gh's tag
          # lookup reports "release not found" when one of its lookups fails
          # transiently, which would create a second draft. The tag is
          # validated as vX.Y.Z above, so it is safe inside the filter.
          list_releases() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$tag\") | {id, draft, assets: [.assets[] | {name, digest}]}"
          }

          releases="$(list_releases)"
          if [ "$(jq -s length <<< "$releases")" -eq 0 ]; then
            # A release created just now may not show up in the list yet, so the
            # new draft is taken from the response of the create call instead.
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent
            releases="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" -f name="$tag" -F draft=true -F body=@release-notes.md \
              --jq '{id, draft, assets: [.assets[] | {name, digest}]}')"
          fi
          count="$(jq -s length <<< "$releases")"
          if [ "$count" -ne 1 ]; then
            echo "::error::Found $count releases for $tag, expected exactly one; resolve by hand." >&2
            exit 1
          fi
          release_id="$(jq -r '.id' <<< "$releases")"

          if [ "$(jq -r '.draft' <<< "$releases")" = true ]; then
            unexpected="$(jq -r --argjson expected "$expected_names" \
              '[.assets[].name | select(IN($expected[]) | not)] | join(" ")' <<< "$releases")"
            if [ -n "$unexpected" ]; then
              echo "::error::Draft release for $tag holds unexpected assets: $unexpected; resolve by hand." >&2
              exit 1
            fi
            gh release upload "$tag" --clobber "${assets[@]}"
            # Publishing a draft whose tag is gone would make GitHub create the
            # tag on the default branch's head, and a moved tag would publish
            # these assets under other code.
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$tag" --jq .sha)" || tag_sha=""
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag does not exist or could not be verified to point at $GITHUB_SHA; not publishing the draft release." >&2
              exit 1
            fi
            # Without tag_name the API detaches the draft from its tag.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false -F tag_name="$tag" --silent
          else
            problems=()
            for asset in "${assets[@]}"; do
              name="$(basename "$asset")"
              local_digest="sha256:$(sha256sum -- "$asset" | cut -d ' ' -f 1)"
              release_digest="$(jq -r --arg name "$name" \
                '[.assets[] | select(.name == $name)] | if length == 0 then "" else .[0].digest // "none" end' <<< "$releases")"
              if [ -z "$release_digest" ]; then
                problems+=("$name is missing")
              elif [ "$release_digest" = none ]; then
                problems+=("$name has no digest")
              elif [ "$release_digest" != "$local_digest" ]; then
                problems+=("$name has digest $release_digest, this build has $local_digest")
              fi
            done
            if [ "${#problems[@]}" -gt 0 ]; then
              for problem in "${problems[@]}"; do
                echo "::error::Published release $tag: $problem" >&2
              done
              echo "::error::This workflow never changes a published release; add the missing asset by hand." >&2
              exit 1
            fi
            echo "Release $tag is already published with matching assets; nothing to do."
          fi

  registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write       # MCP Registry login via GitHub OIDC

    steps:
      - name: Verify tag is an exact plain SemVer (no pre-release suffix)
        # Gated here too, not only through `needs: publish`: this job's own
        # credentials must not depend on another job's check.
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not an exact plain vMAJOR.MINOR.PATCH tag — refusing to publish" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The registry listing follows main, the public release line; a tag
      # that was not promoted to main is published to PyPI but not listed.
      # Ancestry, not equality, so a re-run still publishes after main has
      # moved on.
      - name: Check that main contains this tag
        id: main
        run: |
          status=0
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || status=$?
          case "$status" in
            0) echo "on_main=true" >> "$GITHUB_OUTPUT" ;;
            1)
              echo "::notice::$GITHUB_SHA is not on main — not publishing to the MCP Registry"
              echo "on_main=false" >> "$GITHUB_OUTPUT"
              ;;
            *) exit "$status" ;;
          esac

      - name: Publish to the MCP Registry
        if: steps.main.outputs.on_main == 'true'
        run: |
          tools/install-mcp-publisher.sh "$RUNNER_TEMP"
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish server.json
