# Local OpenProject instances for runtime verification of the MCP client
# across the full supported minor-version range (16.0-17.7). We run the
# LATEST patch of every minor (what users actually run), using the all-in-one
# images (NOT -slim, which have no bundled database and crash on boot).
#
#   16.0.1  first version in our support range
#   16.1.1  Project::Phase(Definition) introduced
#   16.2.2
#   16.3.2
#   16.4.1
#   16.5.1
#   16.6.10 classic numeric identifiers (no displayId, no semantic) -- our
#           long-standing "classic baseline" pin
#   17.0.7  workspaces introduced
#   17.1.4  storages' forbiddenFileNameCharacters field introduced
#   17.2.4
#   17.3.4  sprints, meeting_agenda_items/sections, recurring_meetings,
#           user non-working-times/working-hours introduced
#   17.4.1  displayId field introduced
#   17.5.1  project-based semantic identifiers active + workspaces favorites
#   17.6.0  same semantic-identifier generation as 17.5; backlog_buckets,
#           meeting_outcomes introduced
#   17.7.2  latest release as of this pin; same semantic-identifier
#           generation as 17.5/17.6; user working-times generally available
#           (no longer feature-flag-gated)
#
# Driven by up.sh / down.sh. SECRET_KEY_BASE comes from a generated .env
# (gitignored); never hardcode it here.

services:
  op-16-0:
    image: openproject/openproject:16.0.1
    ports:
      - "8160:80"
    environment:
      OPENPROJECT_HOST__NAME: localhost:8160
      OPENPROJECT_HTTPS: "false"
      OPENPROJECT_DEFAULT__LANGUAGE: en
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set via up.sh / .env}
    volumes:
      - op160_pgdata:/var/openproject/pgdata
      - op160_assets:/var/openproject/assets
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health_checks/default"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

