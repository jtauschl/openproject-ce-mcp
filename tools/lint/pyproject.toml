# The lint and packaging tools of ./dev and the workflows, locked with hashes in their own project. They stay out of
# the shipped package's lock, so `./dev licenses` and the SBOM keep covering only what users install. Nothing here is
# built or published.
[project]
name = "openproject-ce-mcp-lint"
version = "0"
description = "Locked tools for the checks of openproject-ce-mcp"
requires-python = ">=3.11"
dependencies = [
  "bandit>=1.9,<2",
  "semgrep>=1.184,<2",
  "twine>=7,<8",
  "pip-licenses==5.5.5",
]

[tool.uv]
package = false
